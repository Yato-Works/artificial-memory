# AM Apex Unified Configuration
# This file freezes all hyperparameters to ensure reproducible "Apex" results.

global:
  temperature: 0.0
  seed: 42
  model_provider: "ollama" # or "deepseek", "openai"
  default_model: "deepseek-v3" # Adjusted based on AM environment

benchmarks:
  locomo:
    name: "LoCoMo-10"
    frozen_set: "1940Q"
    token_budget: 1000
    judge_model: "gpt-4o"
    
  longmemeval:
    name: "LongMemEval"
    frozen_set: "500Q"
    token_budget: 1000
    judge_model: "gpt-4o"
    
  beam:
    name: "BEAM"
    scales: ["100K", "500K", "1M", "10M"]
    token_budget: 1000
    judge_model: "gpt-4o"
    
  perma:
    name: "PERMA"
    token_budget: 1000
    judge_model: "gpt-4o"

metrics:
  recall_k: [1, 5, 10, 20]
  latency_threshold_ms: 200
  token_efficiency_target: 700