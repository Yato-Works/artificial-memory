apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: memoryworkers.memory.artificialmemory.dev
  labels:
    app.kubernetes.io/name: artificial-memory-operator
    app.kubernetes.io/version: "0.1.0"
spec:
  group: memory.artificialmemory.dev
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - workerType
                - clusterRef
              properties:
                workerType:
                  type: string
                  enum: ["compiler", "consolidation", "recall"]
                  description: Type of worker
                clusterRef:
                  type: string
                  description: Reference to ArtificialMemoryCluster
                replicas:
                  type: integer
                  minimum: 1
                  maximum: 20
                  default: 2
                resources:
                  type: object
                  properties:
                    requests:
                      type: object
                      properties:
                        memory:
                          type: string
                          default: "512Mi"
                        cpu:
                          type: string
                          default: "250m"
                    limits:
                      type: object
                      properties:
                        memory:
                          type: string
                          default: "2Gi"
                        cpu:
                          type: string
                          default: "1000m"
                config:
                  type: object
                  description: Worker-specific configuration
                  additionalProperties:
                    type: string
                autoscaling:
                  type: object
                  properties:
                    enabled:
                      type: boolean
                      default: false
                    minReplicas:
                      type: integer
                      minimum: 1
                      default: 1
                    maxReplicas:
                      type: integer
                      maximum: 50
                      default: 10
                    targetCPUUtilization:
                      type: integer
                      minimum: 10
                      maximum: 90
                      default: 70
                    targetMemoryUtilization:
                      type: integer
                      minimum: 10
                      maximum: 90
                      default: 80
                queue:
                  type: object
                  properties:
                    name:
                      type: string
                    visibilityTimeout:
                      type: integer
                      default: 300
                    maxRetries:
                      type: integer
                      default: 3
            status:
              type: object
              properties:
                phase:
                  type: string
                  enum: ["Pending", "Creating", "Running", "Scaling", "Degraded", "Failed"]
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                        enum: ["True", "False", "Unknown"]
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
                readyReplicas:
                  type: integer
                desiredReplicas:
                  type: integer
                currentReplicas:
                  type: integer
                processedJobs:
                  type: integer
                  description: Total jobs processed
                failedJobs:
                  type: integer
                  description: Total failed jobs
                avgProcessingTimeMs:
                  type: integer
                  description: Average job processing time in milliseconds
  scope: Namespaced
  names:
    plural: memoryworkers
    singular: memoryworker
    kind: MemoryWorker
    shortNames:
      - mw
  additionalPrinterColumns:
    - name: Type
      type: string
      jsonPath: .spec.workerType
    - name: Phase
      type: string
      jsonPath: .status.phase
    - name: Ready
      type: integer
      jsonPath: .status.readyReplicas
    - name: Desired
      type: integer
      jsonPath: .status.desiredReplicas
    - name: Processed
      type: integer
      jsonPath: .status.processedJobs
    - name: Age
      type: date
      jsonPath: .metadata.creationTimestamp