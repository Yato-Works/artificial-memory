apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: vectorindexes.memory.artificialmemory.dev
  labels:
    app.kubernetes.io/name: artificial-memory-operator
    app.kubernetes.io/version: "0.1.0"
spec:
  group: memory.artificialmemory.dev
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - clusterRef
                - dimension
              properties:
                clusterRef:
                  type: string
                  description: Reference to ArtificialMemoryCluster
                dimension:
                  type: integer
                  minimum: 64
                  maximum: 4096
                  default: 384
                  description: Vector dimension
                indexType:
                  type: string
                  enum: ["hnsw", "ivf", "flat"]
                  default: "hnsw"
                  description: Vector index algorithm
                hnsw:
                  type: object
                  properties:
                    m:
                      type: integer
                      minimum: 4
                      maximum: 64
                      default: 16
                      description: HNSW M parameter (connections per node)
                    efConstruction:
                      type: integer
                      minimum: 16
                      maximum: 512
                      default: 64
                      description: HNSW ef_construction parameter
                    efSearch:
                      type: integer
                      minimum: 16
                      maximum: 512
                      default: 128
                      description: HNSW ef_search parameter
                ivf:
                  type: object
                  properties:
                    nlist:
                      type: integer
                      minimum: 100
                      maximum: 10000
                      default: 100
                      description: Number of inverted lists
                    nprobe:
                      type: integer
                      minimum: 1
                      maximum: 100
                      default: 10
                      description: Number of lists to probe
                storage:
                  type: object
                  properties:
                    backend:
                      type: string
                      enum: ["pgvector", "faiss", "memory"]
                      default: "pgvector"
                    postgres:
                      type: object
                      properties:
                        table:
                          type: string
                          default: "memories"
                        column:
                          type: string
                          default: "embedding"
                sync:
                  type: object
                  properties:
                    enabled:
                      type: boolean
                      default: true
                    intervalSeconds:
                      type: integer
                      minimum: 10
                      maximum: 3600
                      default: 60
                      description: Sync interval from primary store
                    batchSize:
                      type: integer
                      minimum: 100
                      maximum: 10000
                      default: 1000
                resources:
                  type: object
                  properties:
                    requests:
                      type: object
                      properties:
                        memory:
                          type: string
                          default: "1Gi"
                        cpu:
                          type: string
                          default: "500m"
                    limits:
                      type: object
                      properties:
                        memory:
                          type: string
                          default: "4Gi"
                        cpu:
                          type: string
                          default: "2000m"
            status:
              type: object
              properties:
                phase:
                  type: string
                  enum: ["Pending", "Building", "Ready", "Syncing", "Degraded", "Failed"]
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                        enum: ["True", "False", "Unknown"]
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
                totalVectors:
                  type: integer
                  description: Total vectors in index
                indexSize:
                  type: string
                  description: Index size in bytes
                lastSyncTime:
                  type: string
                  format: date-time
                syncLagSeconds:
                  type: integer
                  description: Seconds since last successful sync
                buildProgress:
                  type: integer
                  description: Build progress percentage (0-100)
                searchLatencyP50Ms:
                  type: integer
                searchLatencyP99Ms:
                  type: integer
  scope: Namespaced
  names:
    plural: vectorindexes
    singular: vectorindex
    kind: VectorIndex
    shortNames:
      - vi
  additionalPrinterColumns:
    - name: Phase
      type: string
      jsonPath: .status.phase
    - name: Vectors
      type: integer
      jsonPath: .status.totalVectors
    - name: Size
      type: string
      jsonPath: .status.indexSize
    - name: Sync Lag
      type: integer
      jsonPath: .status.syncLagSeconds
    - name: Index Type
      type: string
      jsonPath: .spec.indexType
    - name: Age
      type: date
      jsonPath: .metadata.creationTimestamp