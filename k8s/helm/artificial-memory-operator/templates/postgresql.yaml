{{- if and .Values.postgresql.enabled .Values.postgresql.cnpg.enabled }}
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ .Values.postgresql.cnpg.clusterName }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ include "artificial-memory-operator.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: postgresql
spec:
  instances: {{ .Values.postgresql.cnpg.instances }}
  imageName: ghcr.io/cloudnative-pg/postgresql:16.4
  primaryUpdateStrategy: unsupervised
  storage:
    size: {{ .Values.postgresql.cnpg.storageSize }}
    storageClass: {{ .Values.postgresql.cnpg.storageClass | default "standard" }}
  resources:
    {{- toYaml .Values.postgresql.cnpg.resources | nindent 4 }}
  bootstrap:
    initdb:
      database: {{ .Values.postgresql.cnpg.bootstrap.initdb.database }}
      owner: {{ .Values.postgresql.cnpg.bootstrap.initdb.owner }}
      {{- if .Values.postgresql.cnpg.bootstrap.initdb.encoding }}
      encoding: {{ .Values.postgresql.cnpg.bootstrap.initdb.encoding }}
      {{- end }}
      {{- if .Values.postgresql.cnpg.bootstrap.initdb.locale }}
      locale: {{ .Values.postgresql.cnpg.bootstrap.initdb.locale }}
      {{- end }}
  postgresql:
    parameters:
      {{- toYaml .Values.postgresql.cnpg.postgresql.parameters | nindent 6 }}
  {{- if .Values.postgresql.cnpg.backup.enabled }}
  backup:
    retentionPolicy: {{ .Values.postgresql.cnpg.backup.retentionPolicy }}
    {{- if .Values.postgresql.cnpg.backup.schedule }}
    schedule: {{ .Values.postgresql.cnpg.backup.schedule | quote }}
    {{- end }}
    {{- if .Values.postgresql.cnpg.backup.storage }}
    storage:
      {{- toYaml .Values.postgresql.cnpg.backup.storage | nindent 6 }}
    {{- end }}
  {{- end }}
  monitoring:
    enabled: {{ .Values.monitoring.enabled }}
    {{- if .Values.monitoring.enabled }}
    prometheusRule:
      enabled: {{ .Values.monitoring.prometheusRule.enabled }}
    {{- end }}
  affinity:
    podAntiAffinityType: preferred
    podAntiAffinity:
      topologyKey: kubernetes.io/hostname
---
{{- end }}