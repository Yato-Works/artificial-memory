{{- if .Values.podDisruptionBudget.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "artificial-memory-operator.fullname" . }}-operator
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ include "artificial-memory-operator.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      app.kubernetes.io/component: operator
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "artificial-memory-operator.fullname" . }}-recall-workers
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ include "artificial-memory-operator.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: recall
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "artificial-memory-operator.fullname" . }}-consolidation-workers
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ include "artificial-memory-operator.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: consolidation
---
{{- end }}